<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NoteWriter</title>
  <link rel="icon" href="../ct_icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
<header class="appbar">
  <h1>
    <a class="app-title-link" href="../index.html">
      <img class="app-title-icon" src="../ct_icon.svg" alt="" aria-hidden="true" width="24" height="24" />
      <span>Home</span>
    </a>
  </h1>
  <div class="tools">
    <button id="copyBtn" title="Copy output">Copy</button>
    <button id="clearSectionBtn" title="Clear section">Clear Section</button>
    <button id="clearAllBtn" title="Clear all">Clear All</button>
  </div>
</header>
  <div class="tab_bar">
    <nav id="tier1" class="tabs tier1"></nav>
    <nav id="tier2" class="tabs tier2"></nav>
  </div>
  <div id="headerItems" class="header-items-bar" aria-live="polite"></div>
  <main id="grid" class="section-grid" aria-live="polite"></main>

  <aside class="output">
    <div class="output-header">Output</div>
    <textarea id="out" rows="10" spellcheck="false"></textarea>
  </aside>
  <div class="out-wrap">
  <div class="out-head">Complete Note</div>
  <textarea id="completeOut" rows="12" readonly></textarea>
  </div>

  <script type="module" src="js/app.js"></script>
  <footer class="app-footer">
    NoteWriter – App Version: <span id="app-version-placeholder">loading...</span>
  </footer>
</body>
</html>
