<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NoteWriter</title>
  <link rel="icon" href="../ct_icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
<header class="appbar">
  <div class="appbar__brand">
    <a class="app-title-link" href="../index.html">
      <img class="app-title-icon" src="../ct_icon.svg" alt="" aria-hidden="true" width="24" height="24" />
      <span>Home</span>
    </a>
    <div class="appbar__title-block">
      <div class="appbar__eyebrow">NoteWriter</div>
      <div class="appbar__subtitle">Structured SOAP note builder</div>
    </div>
  </div>
  <div class="appbar__controls">
    <div class="toolbar-group toolbar-group--actions" aria-label="Note actions">
      <button id="copyBtn" title="Copy current section preview">Copy Section</button>
      <button id="copyFullBtn" title="Copy complete note">Copy Full Note</button>
      <button id="clearSectionBtn" title="Clear current section">Clear Section</button>
      <button id="clearAllBtn" title="Clear all sections for the current note">Clear Note</button>
    </div>
    <div id="patientToolbar" class="toolbar-group toolbar-group--patients" aria-label="Patient session controls"></div>
  </div>
</header>
  <div class="tab_bar">
    <nav id="tier1" class="tabs tier1"></nav>
    <nav id="tier2" class="tabs tier2"></nav>
  </div>
  <div id="headerItems" class="header-items-bar" aria-live="polite"></div>
  <main id="grid" class="section-grid" aria-live="polite"></main>

  <section class="note-output-layout" aria-label="Note outputs">
    <div class="out-wrap out-wrap--complete">
      <div class="out-head">
        <div>
          <div class="out-title-row">
            <span class="out-kicker">Primary Output</span>
            <h2 class="out-title">Complete Note</h2>
          </div>
          <p class="out-copy">Full note assembled from every populated section.</p>
        </div>
        <div class="cn-metrics" data-cn="metrics" aria-live="polite"></div>
      </div>
      <textarea id="completeOut" rows="12" readonly></textarea>
    </div>

    <aside class="output out-wrap out-wrap--section">
      <div class="out-head">
        <div>
          <div class="out-title-row">
            <span class="out-kicker">Working Preview</span>
            <h2 class="out-title">Current Section Preview</h2>
          </div>
          <p class="out-copy">Only the active section. Use this for quick checks before copying the full note.</p>
        </div>
        <div id="sectionPreviewScope" class="out-scope" aria-live="polite"></div>
      </div>
      <textarea
        id="out"
        rows="10"
        readonly
        spellcheck="false"
        placeholder="Section preview appears here as you document."
      ></textarea>
    </aside>
  </section>

  <script type="module" src="js/app.js"></script>
  <footer class="app-footer">
    NoteWriter – App Version: <span id="app-version-placeholder">loading...</span>
  </footer>
</body>
</html>
